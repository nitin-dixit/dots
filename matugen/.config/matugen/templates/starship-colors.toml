"$schema" = 'https://starship.rs/config-schema.json'
command_timeout = 1000
palette = 'colors'


# Starship modules
[character]
# Note the use of Catppuccin color 'peach'
success_symbol = "[[󰣇](#74c7ec) ❯](#fab388)"
error_symbol = "[[࿗](#f38ba8) ❯](#fab387)"
vimcmd_symbol = "[[](bold #a6e3a1) ❮](#a6e3a1)" # For use with zsh-vi-mode


[battery]
disabled = true


[golang]
symbol = " "
style = "bold #89dceb"


[git_branch]
symbol = " "
truncation_length = 10
ignore_branches = ['master', 'main']
# format = "[](fg:color8 bg:color4)[ ](bg:color8 fg:color5)[](fg:color8 bg:color4)[(bg:color8 fg:color5) $branch](fg:color3 bg:color4)[](fg:color4) "

[directory]
read_only = " 󰌾"
format = "[](fg:color1 bg:color4)[󰉋](bg:color1 fg:color2)[ ](fg:color1 bg:color4)[$path ](fg:color3 bg:color4)[ ](fg:color4)"
truncation_length = 4


