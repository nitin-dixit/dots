include=~/.config/foot/foot-colors.ini
shell=zsh

title=foot

font=Maple Mono NF:size=9.5:slant=italic
font-italic=Maple Mono NF Italic:size=9.5
font-bold=Maple Mono NF:size=9.5:weight=bold
font-bold-italic=Maple Mono NF Italic:size=9.5:weight=bold

# Match Ghostty
letter-spacing=0
dpi-aware=yes

box-drawings-uses-font-glyphs=yes
# Ghostty uses 4px horizontal padding.
# Foot's pad is terminal-cell padding, so keep this conservative.
pad=4x4

# Match Ghostty's typography behavior
bold-text-in-bright=yes

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+c
clipboard-paste=Control+v
# primary-paste=Shift+Insert
search-start=Control+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
delete-prev-word=Control+BackSpace

[text-bindings]
\x03=Control+Shift+c

[mouse]

# Hide cursor while typing, like a modern GUI terminal.
hide-when-typing=yes
